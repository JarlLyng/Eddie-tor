# Builds the package and runs the self test on pull requests and pushes to main.
# The self test makes its own media, exports it through the real pipeline and checks the result,
# so it needs no signing and no App Store account.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'website/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'website/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Self test
        run: |
          set -o pipefail
          .build/debug/Eddie --selftest "$RUNNER_TEMP/eddie-test" | tee "$RUNNER_TEMP/selftest.log"
          grep -q 'SELFTEST OK' "$RUNNER_TEMP/selftest.log"
