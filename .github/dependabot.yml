# Keeps the GitHub Actions current. The Swift package (IAMJARLDesignTokens) is updated by hand,
# with the design system's releases.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # A new release waits a week before Dependabot proposes it, so a compromised release
    # has time to be caught first. Security updates are not held back by this.
    cooldown:
      default-days: 7
